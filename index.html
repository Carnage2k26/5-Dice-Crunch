<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crunch</title>
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crunch">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23c2410c'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2b2118;--mute:#7a6c5d;--acc:#c2410c;--acc2:#15803d;--bad:#b91c1c;--line:#e6dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1511;--card:#26201a;--ink:#f3eadc;--mute:#a69888;--acc:#fb923c;--acc2:#4ade80;--bad:#f87171;--line:#3b3228;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1511;--card:#26201a;--ink:#f3eadc;--mute:#a69888;--acc:#fb923c;--acc2:#4ade80;--bad:#f87171;--line:#3b3228;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;max-width:520px;margin:auto;padding:14px}
h1{margin:0 0 8px;font-size:28px;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--ink)}
input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;margin:4px 0 8px}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button.g{background:var(--acc2);color:#10200f;border-color:var(--acc2);font-weight:600}
button.d{color:var(--bad)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.dice{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.dice select{width:100%;font-size:22px;text-align:center;padding:12px 0}
.dice select.x{opacity:.4}
.big{font-size:44px;font-weight:700;text-align:center;line-height:1}
.mute{color:var(--mute);font-size:13px}
.pl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;border:2px solid transparent}
.pl.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.pl .n{font-weight:600;min-width:0;outline:none}
.pl .s{font-size:22px;font-weight:700}
.msg{color:var(--acc);font-weight:600;min-height:20px;text-align:center;margin:4px 0}
.win{background:var(--acc2);color:#10200f;font-weight:700;text-align:center;padding:12px;border-radius:12px;margin-bottom:12px}
details{margin-bottom:12px}summary{cursor:pointer;font-weight:600;padding:6px 0}
.h{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
</style></head><body>
<h1>🎲 Crunch</h1>
<p class="sub">Pick each die's face. Score no points and you crunch.</p>
<div id="app"></div>
<script>
const KEY='crunch-v1';
let S={target:3000,thresh:300,playing:false,players:[{name:'Player 1',score:0,started:false,crunches:0},{name:'Player 2',score:0,started:false,crunches:0}],cur:0,turn:0,hand:0,adds:[],hist:[],past:[],over:false,winner:null,msg:''};
try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
let d=[0,0,0,0,0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const need=()=>S.thresh;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function base(c){let sc=0,u=0;
 for(let f=1;f<=6;f++){const n=c[f];if(!n)continue;
  const single=f==1?100*n:f==5?50*n:0;
  let set=0;if(n>=3)set=(f==1?1000:f*100)*Math.pow(2,n-3);
  if(set>single){sc+=set;u+=n}else if(single){sc+=single;u+=n}}
 return {sc,u}}
function score(dice){const c=[0,0,0,0,0,0,0];dice.forEach(x=>{if(x)c[x]++});
 let best=base(c);
 [[1,2,3,4,5,500],[2,3,4,5,6,500],[1,2,3,4,0,300],[2,3,4,5,0,300],[3,4,5,6,0,300]].forEach(s=>{
  const fs=s.slice(0,5).filter(Boolean);if(fs.some(f=>!c[f]))return;
  const c2=c.slice();fs.forEach(f=>c2[f]--);
  const b=base(c2),sc=s[5]+b.sc,u=fs.length+b.u;
  if(sc>best.sc||(sc==best.sc&&u>best.u))best={sc,u}});
 for(let f=1;f<=6;f++)if(c[f]==3)for(let g=1;g<=6;g++)if(g!=f&&c[g]==2){const sc=(f==1?1000:f*100)+200;if(sc>best.sc||(sc==best.sc&&best.u<5))best={sc,u:5}}
 return best}

function logH(t,p){S.hist.unshift({p:S.players[S.cur].name,t,pts:p})}
function next(){S.cur=(S.cur+1)%S.players.length;S.turn=0;S.hand=0;S.adds=[];d=[0,0,0,0,0]}
function add(){const r=score(d);if(r.sc<=0)return;
 S.adds.push({sc:r.sc,prev:S.hand});S.turn+=r.sc;S.hand+=r.u;
 S.msg='';if(S.hand>=5){S.hand=0;S.msg='All five scored — roll all five again!'}
 d=[0,0,0,0,0];save();render()}
function undo(){const a=S.adds.pop();if(!a)return;S.turn-=a.sc;S.hand=a.prev;S.msg='';save();render()}
function crunch(){const p=S.players[S.cur];p.crunches++;S.msg='';
 if(p.crunches>=3){p.crunches=0;p.score=p.score-1000;logH('Three crunches in a row',-1000)}else logH('Crunch',0);
 next();save();render()}
function bank(){const p=S.players[S.cur];
 if(!p.started&&S.turn<need()){S.msg='Need '+need()+' in one turn to start scoring.';render();return}
 p.started=true;p.crunches=0;p.score+=S.turn;logH('Banked',S.turn);S.msg='';
 if(p.score>=S.target){finish(p.name);return}
 next();save();render()}
function finish(w){S.over=true;S.winner=w;
 S.past.unshift({date:new Date().toLocaleDateString(),mode:S.target,winner:w,res:S.players.map(p=>p.name+' '+p.score).join(' · ')});
 save();render()}
function endGame(){if(S.over)return;const top=[...S.players].sort((a,b)=>b.score-a.score)[0];finish(top.score>0?top.name:'No winner')}
function reset(){S.players.forEach(p=>{p.score=0;p.started=false;p.crunches=0});S.cur=0;S.turn=0;S.hand=0;S.adds=[];S.hist=[];S.over=false;S.winner=null;S.msg='';d=[0,0,0,0,0];save();render()}
function addPlayer(){if(S.players.length>=8)return;S.players.push({name:'Player '+(S.players.length+1),score:0,started:false,crunches:0});save();render()}
function removePlayer(){if(S.players.length<=2)return;S.players.pop();if(S.cur>=S.players.length)S.cur=0;save();render()}

function render(){
 if(!S.playing){renderSetup();return}
 const r=score(d),cur=S.players[S.cur],picked=d.filter(Boolean).length;
 const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
 let h=`<div class="card mute" style="text-align:center">First to ${S.target} · ${S.thresh} needed to start scoring</div>`;
 if(S.over)h+=`<div class="win">🏆 ${esc(S.winner)} wins!</div>`;
 h+=`<div class="card">`+S.players.map((p,i)=>`<div class="pl ${i==S.cur&&!S.over?'cur':''}"><span class="n" contenteditable="true" spellcheck="false" data-i="${i}">${esc(p.name)}</span><span><span class="mute">${p.started?'':'not started · '}${p.crunches?'✖'.repeat(p.crunches)+' ':''}</span><span class="s">${p.score}</span></span></div>`).join('')+
 `<div class="row" style="margin-top:8px"><button id="ap">Add player</button><button id="rp" class="d">Remove last</button></div><div class="mute" style="margin-top:6px">Tap a name to rename it.</div></div>`;
 h+=`<div class="card"><div class="mute" style="text-align:center">${esc(cur.name)}'s turn</div><div class="big">${S.turn}</div>
 <div class="mute" style="text-align:center">${S.hand?S.hand+' dice scored this hand':''}</div>
 <div class="dice">${d.map((v,i)=>`<select data-d="${i}" class="${v?'':'x'}"><option value="0">–</option>${[1,2,3,4,5,6].map(f=>`<option value="${f}" ${v==f?'selected':''}>${f}</option>`).join('')}</select>`).join('')}</div>
 <div style="text-align:center;font-weight:600">${picked?(r.sc>0?'This roll: +'+r.sc:'No points — crunch'):'Select your dice'}</div>
 <div class="msg">${esc(S.msg)}</div>
 <div class="row"><button id="clr">Clear dice</button><button id="add" class="p" ${r.sc>0&&!S.over?'':'disabled'}>Add to turn</button></div>
 <div class="row" style="margin-top:8px"><button id="cr" class="d" ${S.over?'disabled':''}>Crunch – pass</button><button id="bk" class="g" ${S.turn>0&&!S.over?'':'disabled'}>Bank turn</button></div>
 <div class="row" style="margin-top:8px"><button id="un" ${S.adds.length?'':'disabled'}>Undo add</button></div></div>
 <div class="row" style="margin-bottom:12px"><button id="rs" class="d">Reset scores</button><button id="eg" ${S.over?'disabled':''}>End game</button><button id="ng">New game</button></div>
 <details><summary>Turn history</summary>${S.hist.length?S.hist.slice(0,60).map(x=>`<div class="h"><span>${esc(x.p)} · ${esc(x.t)}</span><b>${x.pts>0?'+':''}${x.pts}</b></div>`).join(''):'<div class="mute">Nothing yet.</div>'}</details>
 <details><summary>Past games</summary>${S.past.length?S.past.map(x=>`<div class="h"><span>${esc(x.date)} · to ${x.mode}<br><span class="mute">${esc(x.res)}</span></span><b>🏆 ${esc(x.winner)}</b></div>`).join(''):'<div class="mute">No finished games.</div>'}</details>
 <details><summary>Scoring used</summary><div class="mute">Each 1 = 100, each 5 = 50. Three of a kind = face × 100, four = ×2, five = ×4. Three 1s = 1000 (four = 2000, five = 4000). Full house (three of a kind + a pair) = the three of a kind's score + 200. Short straight (4 in a row) = 300, long straight (5) = 500. Nothing scoring is a crunch; three in a row costs 1000 points (scores can go negative). Score all five dice and roll all five again. First scoring needs ${need()} in one turn. First to ${S.target} wins.</div></details>`;
 document.getElementById('app').innerHTML=h;
 const $=id=>document.getElementById(id);
 $('ng').onclick=()=>{S.playing=false;S.msg='';save();render()};
 document.querySelectorAll('[data-d]').forEach(s=>s.onchange=e=>{d[+s.dataset.d]=+e.target.value;render()});
 document.querySelectorAll('.n').forEach(n=>{n.onblur=()=>{S.players[+n.dataset.i].name=n.textContent.trim()||'Player '+(+n.dataset.i+1);save();render()};n.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();n.blur()}}});
 $('clr').onclick=()=>{d=[0,0,0,0,0];render()};$('add').onclick=add;$('cr').onclick=crunch;$('bk').onclick=bank;$('un').onclick=undo;
 $('ap').onclick=addPlayer;$('rp').onclick=removePlayer;$('rs').onclick=reset;$('eg').onclick=endGame;
}
function renderSetup(){
 const ps=S.players,$=id=>document.getElementById(id);
 document.getElementById('app').innerHTML=`<div class="card"><b>Players</b>`+ps.map((p,i)=>`<div class="row" style="margin-top:8px"><input class="pn" data-i="${i}" value="${esc(p.name)}" maxlength="20" style="margin:0"><button class="rm d" data-i="${i}" style="flex:0 0 auto" ${ps.length<=2?'disabled':''}>✕</button></div>`).join('')+`<div class="row" style="margin-top:8px"><button id="ap" ${ps.length>=8?'disabled':''}>Add player</button></div></div>
 <div class="card"><b>Game type</b><div class="row" style="margin-top:8px;flex-direction:column">${[[300,3000],[500,5000]].map(([s,t])=>`<button class="gm ${S.thresh==s&&S.target==t?'on':''}" data-s="${s}" data-t="${t}" style="width:100%">${s} to start / ${t} to win</button>`).join('')}</div></div>
 <div class="msg">${esc(S.msg)}</div><button id="go" class="p" style="width:100%;font-size:18px">Start game</button>`;
 document.querySelectorAll('.pn').forEach(n=>n.oninput=()=>{S.players[+n.dataset.i].name=n.value;save()});
 document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{if(S.players.length>2){S.players.splice(+b.dataset.i,1);save();render()}});
 document.querySelectorAll('.gm').forEach(b=>b.onclick=()=>{S.thresh=+b.dataset.s;S.target=+b.dataset.t;save();render()});
 $('ap').onclick=addPlayer;
 $('go').onclick=()=>{const t=S.target,s=S.thresh;
  if(!((s==300&&t==3000)||(s==500&&t==5000))){S.msg='Pick a game type.';render();return}
  if(!(t>=100)){S.msg='Win score must be at least 100.';render();return}
  if(!(s>=0)||s>t){S.msg='Start score must be between 0 and the win score.';render();return}
  S.target=t;S.thresh=s;S.players.forEach((p,i)=>{p.name=p.name.trim()||'Player '+(i+1)});
  reset();S.msg='';S.playing=true;save();render()};
}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
